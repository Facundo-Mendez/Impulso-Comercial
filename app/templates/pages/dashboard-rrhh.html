<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Postulantes | Impulso Comercial</title>
    <link rel="icon" href="/img/logo.png" type="image/png">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/rrhh.css">
    <link rel="stylesheet" href="/css/profile-edit.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
<header class="main-header">
    <div class="container header-inner">
        <a class="logo-container" href="/index.html">
            <img src="/img/logo.png" alt="Logo Impulso Comercial" class="logo-img">
            <div class="logo-text">
                <h1>IMPULSO COMERCIAL</h1>
                <p>Panel de Recursos Humanos</p>
            </div>
        </a>
        <nav class="main-nav" id="mainNav">
            <ul class="nav-list">
                <!-- El menú se cargará dinámicamente según el rol del usuario -->
            </ul>
            <button class="mobile-menu-btn" aria-label="Menú" id="menuBtn">
                <i class="fas fa-bars"></i>
            </button>
        </nav>
    </div>
</header>

<main class="rrhh-dashboard">
    <div class="container">

        <!-- Lista de Postulantes con Filtros -->
        <div class="recent-postulantes">
            <div class="section-header">
                <h2><i class="fas fa-users"></i> Mis Postulantes</h2>
                <button class="btn btn-primary" onclick="rrhhDashboard.showEtiquetas()">
                    <i class="fas fa-tags"></i> Gestionar Etiquetas
                </button>
            </div>

            <!-- Controles de Filtrado -->
            <div class="filters-section">
                <div class="filter-group">
                    <input type="text" id="searchInput" placeholder="Buscar por nombre o email..."
                           class="search-input" onkeyup="rrhhDashboard.handleSearch(event)">
                    <select id="etiquetaFilter" class="filter-select" onchange="rrhhDashboard.handleEtiquetaFilter(event)" title="Filtrar por etiqueta">
                        <option value="">Todas las etiquetas</option>
                    </select>
                    <button class="btn btn-secondary" onclick="rrhhDashboard.clearFilters()">
                        <i class="fas fa-times"></i> Limpiar Filtros
                    </button>
                </div>
            </div>

            <div class="postulantes-list" id="recentPostulantes">
                <div class="loading-spinner">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Cargando postulantes...</p>
                </div>
            </div>

            <!-- Paginación -->
            <div class="pagination-container" id="pagination">
                <!-- Los controles de paginación se cargarán dinámicamente -->
            </div>
        </div>

    </div>
</main>

<!-- Modal para ver detalles -->
<div class="modal" id="detailModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">Detalles</h3>
            <button class="modal-close" id="modalClose" title="Cerrar">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-body" id="modalBody">
            <!-- Contenido dinámico -->
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" id="modalCloseBtn">Cerrar</button>
        </div>
    </div>
</div>

<footer class="main-footer">
    <div class="container footer-grid">
        <div class="footer-brand">
            <img src="/img/logo.png" alt="Logo Impulso Comercial" class="footer-logo">
            <p>Especialistas en reclutamiento de talento comercial.</p>
        </div>
        <div class="footer-contact">
            <h4>Contacto</h4>
            <p><i class="fas fa-envelope"></i> info@impulsocomercial.com</p>
            <p><i class="fas fa-phone"></i> +57 123 456 7890</p>
        </div>
        <div class="footer-social">
            <h4>Seguinos</h4>
            <div class="social-links">
                <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
                <a href="#" aria-label="Twitter"><i class="fab fa-x-twitter"></i></a>
                <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
            </div>
        </div>
    </div>
    <div class="footer-bottom">
        <p>&copy; Impulso Comercial. Todos los derechos reservados.</p>
    </div>
</footer>

<script src="/js/main.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/js/modules/rrhh/dashboard.js"></script>
<script>
    // Verificar autenticación y rol RRHH antes de cargar el dashboard
    document.addEventListener('DOMContentLoaded', function() {
        const token = localStorage.getItem('token');

        if (!token) {
            alert('Debe iniciar sesión para acceder al dashboard de RRHH');
            window.location.href = '/pages/login.html';
            return;
        }

        // Verificar rol de RRHH
        fetch('/api/auth/validate', {
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            }
        })
        .then(response => {
            console.log('Response status:', response.status);
            return response.json();
        })
        .then(data => {
            console.log('Datos recibidos:', data); // Debug
            const userRole = data.rol || (data.usuario && data.usuario.rol);
            const userName = data.usuario ? data.usuario.nombre : (data.nombre || 'Usuario');
            console.log('Rol extraído:', userRole); // Debug
            console.log('Nombre usuario:', userName); // Debug

            if (!userRole || userRole !== 'rrhh') {
                console.log('Usuario no es RRHH, redirigiendo...');
                alert('No tiene permisos para acceder al dashboard de RRHH');
                window.location.href = '/';
                return;
            }

            console.log('Usuario es RRHH, inicializando dashboard...');

            // Actualizar el header para RRHH
            if (typeof updateHeaderForRRHH === 'function') {
                updateHeaderForRRHH(userName);
            }

            // Si es RRHH, inicializar el dashboard
            if (window.rrhhDashboard) {
                console.log('RRHHDashboard encontrado, inicializando...');
                window.rrhhDashboard.init();
            } else {
                console.error('RRHHDashboard no está disponible');
            }
        })
        .catch(error => {
            console.error('Error verificando usuario:', error);
            alert('Error de autenticación');
            window.location.href = '/pages/login.html';
        });
    });
</script>
</body>
</html>
